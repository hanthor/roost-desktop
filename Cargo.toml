[workspace]
resolver = "2"
members = [
    "crates/compositor",
    "crates/shell-control-schema",
    "crates/shell-host",
    "crates/greeter",
    "crates/shell-gtk",
    "crates/wallpaper",
]

# Pinned per ADR 0001 (docs/adr/0001-nested-backend-smithay-pin.md).
# Exact pins keep the Gate #1 verification reproducible.
[workspace.package]
license = "GPL-3.0-or-later"

[workspace.dependencies]
smithay = { version = "=0.7.0", default-features = false, features = ["wayland_frontend", "backend_winit", "desktop"] }
calloop = "=0.14.4"
wayland-protocols = "=0.32.13"
wayland-protocols-wlr = "=0.3.12"
wayland-server = "=0.31.14"
wayland-client = "=0.31.15"
postcard = "=1.1.3"
greetd_ipc = { version = "=0.10.3", features = ["codec", "sync-codec"] }
serde_json = "1"
rustix = { version = "=1.1.5", features = ["fs", "event", "process", "net"] }
freedesktop-desktop-entry = "=0.8.3"
signal-hook = "0.4"
rand = "0.10"
gtk4 = "0.11"
libadwaita = "0.9"
gtk4-layer-shell = "0.8"
gtk4-session-lock = { version = "0.4", features = ["v1_1"] }
glib = "0.22"
gio = "0.22"
jiff = "0.2"
xkbcommon = "=0.9.0"
zbus = "5"
image = "0.25"
jxl-oxide = { version = "0.12", default-features = false, features = ["rayon"] }
resvg = { version = "0.48", default-features = false, features = ["raster-images"] }
rhai = "1.26"

# Wallpaper decoding runs in debug builds too (proofs, nested sessions):
# unoptimised, GNOME's 4K JPEG XL defaults take tens of seconds. The
# generic image code is instantiated inside roost-wallpaper, so that
# crate is optimised as well.
[profile.dev.package.jxl-oxide]
opt-level = 3
[profile.dev.package.jxl-bitstream]
opt-level = 3
[profile.dev.package.jxl-coding]
opt-level = 3
[profile.dev.package.jxl-color]
opt-level = 3
[profile.dev.package.jxl-frame]
opt-level = 3
[profile.dev.package.jxl-grid]
opt-level = 3
[profile.dev.package.jxl-image]
opt-level = 3
[profile.dev.package.jxl-jbr]
opt-level = 3
[profile.dev.package.jxl-modular]
opt-level = 3
[profile.dev.package.jxl-render]
opt-level = 3
[profile.dev.package.jxl-threadpool]
opt-level = 3
[profile.dev.package.jxl-vardct]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.roost-wallpaper]
opt-level = 3
