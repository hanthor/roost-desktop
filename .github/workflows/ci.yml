name: ci

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      # smithay links system libxkbcommon via the xkbcommon crate;
      # the greeter UI needs GTK4/libadwaita dev files.
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev pkg-config libgtk-4-dev libadwaita-1-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  journey:
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      # Nested session needs a display plus X input/capture tools; the
      # journey asserts liveness and visible reaction, humans review
      # the uploaded frames.
      # libxkbcommon-x11 and EGL are dlopened at winit-backend startup
      # (not at build time), so the nested run needs them even though
      # check does not. Mesa swrast provides software GL on runners.
      # The shell's gio settings read needs glib dev files at build
      # time (check gets them transitively via GTK).
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libegl1 libgl1-mesa-dri libgbm1 pkg-config xvfb xdotool x11-apps scrot shellcheck libglib2.0-dev libgtk-4-dev libadwaita-1-dev
      - run: shellcheck scripts/roost-journey scripts/roost-nested scripts/roost-release scripts/check-release-package
      - run: scripts/roost-release --allow-dirty --out package-artifacts && scripts/check-release-package package-artifacts/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: roost-deb
          path: package-artifacts/
          retention-days: 14
      - run: scripts/roost-journey --artifacts journey-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-shots
          path: journey-artifacts/
          retention-days: 14

  app-content:
    runs-on: ubuntu-latest
    needs: [check]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      # Headed Chromium as a Wayland client of the nested session, via
      # Playwright. The script asserts our compositor shows app content
      # (baseline-vs-app diff plus app-color pixel count), humans review
      # the uploaded frames. Playwright installs its own venv, browser,
      # and browser system libraries on the runner.
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libegl1 libgl1-mesa-dri libgbm1 pkg-config xvfb xdotool x11-apps scrot shellcheck python3-venv libglib2.0-dev libgtk-4-dev libadwaita-1-dev
      - run: shellcheck scripts/roost-app-content scripts/roost-nested
      - run: scripts/roost-app-content --artifacts app-content-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-content-shots
          path: app-content-artifacts/
          retention-days: 14

  scroll-proof:
    runs-on: ubuntu-latest
    needs: [check]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      # Scroll-mode strip proof: three headed-Chromium windows via
      # Playwright, Super+Shift+T toggle, Super+R preset cycling, and
      # wheel scrolling, with gap-geometry pixel asserts. Humans review
      # the uploaded frames.
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libegl1 libgl1-mesa-dri libgbm1 pkg-config xvfb xdotool x11-apps scrot shellcheck python3-venv libglib2.0-dev libgtk-4-dev libadwaita-1-dev
      - run: shellcheck scripts/roost-scroll-proof scripts/roost-nested
      - run: scripts/roost-scroll-proof --artifacts scroll-proof-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scroll-proof-shots
          path: scroll-proof-artifacts/
          retention-days: 14

  arch-package:
    # TunaOS Marlin is Arch-based: build, check, and install the Arch
    # package in a clean archlinux container (#69).
    runs-on: ubuntu-latest
    needs: [check]
    timeout-minutes: 40
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git rust pkgconf gtk4 libadwaita libxkbcommon libxkbcommon-x11 mesa wayland dbus glib2 namcap
      - uses: actions/checkout@v7
      - run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && ROOST_LOCAL_SRC='$GITHUB_WORKSPACE' makepkg -f --noconfirm"
      - run: |
          pkg=$(ls packaging/arch/roost-*.pkg.tar.zst)
          namcap "$pkg" || true
          pacman -U --noconfirm "$pkg"
          for bin in roost-compositor roost-session roost-shell-host roost-greeter; do "$bin" --version; done
          test -f /usr/share/wayland-sessions/roost.desktop
          mkdir -p arch-artifacts && cp "$pkg" arch-artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: roost-arch
          path: arch-artifacts/
          retention-days: 14

  marlin-image:
    # Roost layered on ghcr.io/tuna-os/marlin:gnome (GNOME 51 baseline
    # image) as a nested preview. Built on every PR, pushed from main.
    runs-on: ubuntu-latest
    needs: [arch-package]
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: roost-arch
          path: arch-artifacts
      - name: Free disk for the Marlin base image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - run: |
          pkg=$(ls arch-artifacts/roost-*.pkg.tar.zst)
          cp "$pkg" ./roost.pkg.tar.zst
          podman build -f packaging/marlin/Containerfile \
            --build-arg ROOST_PKG=roost.pkg.tar.zst \
            -t marlin-roost-preview:ci .
          podman run --rm marlin-roost-preview:ci roost-compositor --version
          podman run --rm marlin-roost-preview:ci test -f /usr/share/applications/roost-nested-preview.desktop
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          img=ghcr.io/hanthor/roost-desktop/marlin-roost-preview
          podman tag marlin-roost-preview:ci "$img:latest"
          podman tag marlin-roost-preview:ci "$img:${{ github.sha }}"
          podman push "$img:latest"
          podman push "$img:${{ github.sha }}"

  docs-shots:
    runs-on: ubuntu-latest
    needs: [journey, app-content, scroll-proof]
    steps:
      - uses: actions/checkout@v7
      # Curate the release screenshot set out of this run's own proof
      # artifacts and upload it as one bundle: each release takes its
      # docs/shots refresh from here (see docs/screenshots.md). No
      # byte-freshness gate: the panel clock renders live, so a fresh
      # run legitimately differs from the committed set by its digits.
      - uses: actions/download-artifact@v4
        with:
          name: journey-shots
          path: /tmp/roost-docs/journey
      - uses: actions/download-artifact@v4
        with:
          name: app-content-shots
          path: /tmp/roost-docs/app
      - uses: actions/download-artifact@v4
        with:
          name: scroll-proof-shots
          path: /tmp/roost-docs/scroll
      - run: shellcheck scripts/roost-docs-shots
      - run: scripts/roost-docs-shots collect /tmp/roost-docs/journey /tmp/roost-docs/app /tmp/roost-docs/scroll --dest /tmp/roost-docs/shots && ls /tmp/roost-docs/shots | wc -l | grep -q 7
      - uses: actions/upload-artifact@v4
        with:
          name: docs-shots
          path: /tmp/roost-docs/shots/
          retention-days: 90
