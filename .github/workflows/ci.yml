name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede stale PR runs, but let every main run finish: main merges land
  # minutes apart, and cancelling meant no main run ever completed, which
  # also starved performance-baseline.yml (it needs a successful main run).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      # One cache per job: target/ and the registry, keyed by Cargo.lock.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # smithay links system libxkbcommon via the xkbcommon crate;
      # the greeter UI needs GTK4/libadwaita dev files.
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && sudo apt-get install -y libseat-dev libinput-dev libudev-dev libgbm-dev libdrm-dev libxkbcommon-dev pkg-config libgtk-4-dev libpipewire-0.3-dev libadwaita-1-dev libpam-wrapper zstd
      # The GTK shell (ADR 0006) links gtk4-layer-shell, which Ubuntu
      # 24.04 does not package.
      - run: sudo apt-get install -y meson ninja-build libwayland-dev wayland-protocols && scripts/ci-install-gtk4-layer-shell
      - run: scripts/tuna-a11y-baseline check
      # The rename to Tuna Desktop (#505): the script's self-test, and
      # a guard that no branch brings the old name back.
      - run: python3 scripts/lib/rename-to-tuna-tests.py
      - run: scripts/rename-to-tuna --check --no-cargo
      - run: python3 scripts/lib/tuna-soak-tests.py
      - run: python3 scripts/lib/vm-boot-tests.py
      - run: python3 scripts/lib/marlin-kernel-tests.py
      - run: python3 scripts/lib/gnome-drained-tests.py
      - run: python3 scripts/lib/tuna-perf-payload-tests.py
      - run: python3 scripts/lib/tuna-perf-reference-tests.py
      - run: python3 scripts/lib/tuna-perf-repeatability-tests.py
      - run: python3 scripts/lib/native-constraint-tests.py
      - run: python3 scripts/lib/tuna-pipewire-dump-tests.py
      - run: scripts/tuna-settings-inventory-check
      - run: cargo fmt --all -- --check
      - name: Check bounded EIS transport regression tests
        run: |
          cargo fmt --manifest-path third-party/reis/Cargo.toml --all -- --check
          cargo test --manifest-path third-party/reis/Cargo.toml --lib roost_transport_bounds
      - run: rustfmt --edition 2021 --check third-party/smithay/src/xwayland/xserver.rs third-party/smithay/src/backend/drm/surface/gbm.rs
      - run: cargo test --locked --manifest-path third-party/smithay/Cargo.toml --no-default-features --features xwayland,wayland_frontend prepared_socket
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # pam_wrapper runs the lock screen's PAM path for real (#62); it is
      # required here so the test can never silently skip.
      - run: cargo test --workspace
        env:
          TUNA_REQUIRE_PAM_WRAPPER: "1"
      - name: Shortcut inhibition consent proof
        run: scripts/tuna-shortcut-proof
      # Every listed test just passed: the parity-ledger job resolves
      # the ledger's cargo:<name> references against this list.
      - run: cargo test --workspace -q -- --list --format terse > test-list.txt
      - run: scripts/tuna-test-strategy --test-list test-list.txt --report test-strategy-report.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: executed-test-strategy-report
          path: test-strategy-report.md
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-list
          path: test-list.txt
          retention-days: 14

  journey:
    runs-on: ubuntu-26.04
    needs: [check]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      # One cache per job: target/ and the registry, keyed by Cargo.lock.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Nested session needs a display plus X input/capture tools; the
      # journey asserts liveness and visible reaction, humans review
      # the uploaded frames.
      # libxkbcommon-x11 and EGL are dlopened at winit-backend startup
      # (not at build time), so the nested run needs them even though
      # check does not. Mesa swrast provides software GL on runners.
      # The shell's gio settings read needs glib dev files at build
      # time (check gets them transitively via GTK).
      # Genuine Ubuntu26.04 distro packages, not /usr/local source libraries.
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && sudo apt-get install -y --no-install-recommends libseat-dev libinput-dev libudev-dev libgbm-dev libdrm-dev libxkbcommon-dev libxkbcommon-x11-dev libegl1 libgl1-mesa-dri libgbm1 pkg-config xvfb xdotool scrot ffmpeg jq dbus libglib2.0-bin xwayland x11-apps x11-utils pipewire wireplumber gstreamer1.0-pipewire gstreamer1.0-tools gstreamer1.0-plugins-good at-spi2-core python3-pyatspi python3-pil libsecret-tools gnome-keyring fonts-cantarell shellcheck libglib2.0-dev libgtk-4-dev libpipewire-0.3-dev libadwaita-1-dev meson ninja-build libwayland-dev wayland-protocols libpam-wrapper ibus ibus-gtk3 ibus-gtk4 gir1.2-ibus-1.0 gir1.2-gtk-3.0 wayland-utils xdg-desktop-portal xdg-desktop-portal-gnome xdg-desktop-portal-gtk libgtk4-layer-shell-dev dpkg-dev gsettings-desktop-schemas
      - run: pkg-config --atleast-version=1.1 gtk4-layer-shell-0 && pkg-config --atleast-version=4.12 gtk4 && pkg-config --atleast-version=1.0 libadwaita-1
      - run: shellcheck -x scripts/tuna-journey scripts/tuna-nested scripts/tuna-release scripts/check-release-package scripts/lib/tuna-introspect.sh scripts/lib/tuna-proof-session-launch scripts/ci-prepare-artifacts
      - run: python3 scripts/lib/installed-deb-proof-tests.py
      - run: python3 scripts/lib/release-deb-ownership-tests.py
      - run: scripts/tuna-release --allow-dirty --out package-artifacts && scripts/check-release-package package-artifacts/*.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tuna-deb
          path: package-artifacts/
          retention-days: 14
      - run: scripts/tuna-journey --artifacts journey-artifacts
      - name: Install exact Debian-format candidate and isolated companion fixtures
        run: |
          sudo apt-get install -y --no-install-recommends ./package-artifacts/*.deb
          cargo build --locked --release -p tuna-compositor --example icon-probe --example shortcut-inhibit-client
          mkdir -p package-artifacts/installed
          cp /etc/os-release package-artifacts/installed/os-release
          dpkg-query -W > package-artifacts/installed/dpkg-versions.txt
          apt-cache policy libgtk4-layer-shell0 libgtk-4-1 libadwaita-1-0 > package-artifacts/installed/apt-policy.txt
          sha256sum package-artifacts/*.deb > package-artifacts/installed/package.sha256
          sudo install -d -m0755 /usr/libexec/tuna-deb-proof
          sudo install -m0755 target/release/examples/icon-probe target/release/examples/shortcut-inhibit-client /usr/libexec/tuna-deb-proof/
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('target/release/examples')
          value = {'commit': os.environ['GITHUB_SHA'], 'files': {name: hashlib.sha256((root/name).read_bytes()).hexdigest() for name in ('icon-probe', 'shortcut-inhibit-client')}}
          Path('package-artifacts/installed/companions.json').write_text(json.dumps(value) + '\n')
          PY
          sudo install -m0644 package-artifacts/installed/companions.json /usr/libexec/tuna-deb-proof/provenance.json
      - name: Qualify the actual installed preferred GTK session
        run: |
          export HOME="$RUNNER_TEMP/tuna-deb-home"
          mkdir -p "$HOME"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/tuna-deb-runtime"
          mkdir -m0700 "$XDG_RUNTIME_DIR"
          unset WAYLAND_DISPLAY WAYLAND_SOCKET TUNA_SHELL_BIN TUNA_PROOF_SHELL_BIN LD_LIBRARY_PATH
          scripts/tuna-gtk-shell-proof --installed-package --artifacts package-artifacts/installed/controls
        env:
          TUNA_REQUIRE_PAM_WRAPPER: "1"
          TUNA_REQUIRE_IBUS: "1"
          TUNA_REQUIRE_WAYLAND_INFO: "1"
      # FIFOs and sockets left by the proofs make the zipper warn
      # ENTRYNOTSUPPORTED and drop them (#484); list and remove them first.
      - if: always()
        run: scripts/ci-prepare-artifacts journey-artifacts package-artifacts/installed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: journey-shots
          path: journey-artifacts/
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: tuna-deb-installed-proof
          path: package-artifacts/installed/
          retention-days: 90

  app-content:
    runs-on: ubuntu-latest
    needs: [check]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      # One cache per job: target/ and the registry, keyed by Cargo.lock.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Headed Chromium as a Wayland client of the nested session, via
      # Playwright. The script asserts our compositor shows app content
      # (baseline-vs-app diff plus app-color pixel count), humans review
      # the uploaded frames. Playwright installs its own venv, browser,
      # and browser system libraries on the runner.
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && sudo apt-get install -y libseat-dev libinput-dev libudev-dev libgbm-dev libdrm-dev libxkbcommon-dev libxkbcommon-x11-dev libegl1 libgl1-mesa-dri libgbm1 pkg-config xvfb xdotool x11-apps scrot shellcheck python3-venv libglib2.0-dev libgtk-4-dev libpipewire-0.3-dev libadwaita-1-dev
      - run: shellcheck scripts/tuna-app-content scripts/tuna-nested
      - run: scripts/tuna-app-content --artifacts app-content-artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: app-content-shots
          path: app-content-artifacts/
          retention-days: 14

  scroll-proof:
    runs-on: ubuntu-latest
    needs: [check]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      # One cache per job: target/ and the registry, keyed by Cargo.lock.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Scroll-mode strip proof: three headed-Chromium windows via
      # Playwright, Super+Shift+T toggle, Super+R preset cycling, and
      # wheel scrolling, with gap-geometry pixel asserts. Humans review
      # the uploaded frames.
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && sudo apt-get install -y libseat-dev libinput-dev libudev-dev libgbm-dev libdrm-dev libxkbcommon-dev libxkbcommon-x11-dev libegl1 libgl1-mesa-dri libgbm1 pkg-config xvfb xdotool x11-apps scrot shellcheck python3-venv libglib2.0-dev libgtk-4-dev libpipewire-0.3-dev libadwaita-1-dev
      - run: shellcheck scripts/tuna-scroll-proof scripts/tuna-nested
      - run: scripts/tuna-scroll-proof --artifacts scroll-proof-artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: scroll-proof-shots
          path: scroll-proof-artifacts/
          retention-days: 14

  drm-smoke:
    # Hardware session (#52) on vkms, the kernel's virtual KMS device:
    # libseat (seatd), GBM/EGL scanout, page-flip pacing, shell attach.
    # Needs headroom: the DRM/apt install (incl. linux-modules-extra for
    # vkms) alone can take ~20 min on a cold runner cache.
    runs-on: ubuntu-latest
    needs: [check]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      # One cache per job: target/ and the registry, keyed by Cargo.lock.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Use the Ubuntu archive for DRM dependencies
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [[ -f "$source" ]]; then
              sudo sed -i 's|https\?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y libseat-dev libinput-dev libudev-dev libgbm-dev libdrm-dev libxkbcommon-dev libxkbcommon-x11-dev libegl1 libgl1-mesa-dri libgbm1 pkg-config libwayland-dev wayland-protocols seatd jq ffmpeg shellcheck libglib2.0-dev libgtk-4-dev libpipewire-0.3-dev libadwaita-1-dev "linux-modules-extra-$(uname -r)"
      - run: shellcheck scripts/tuna-drm-smoke scripts/tuna-frame-pacer-build
      - run: scripts/tuna-drm-smoke --artifacts drm-smoke-artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: drm-smoke
          path: drm-smoke-artifacts/
          retention-days: 14

  gtk-shell:
    outputs:
      proof_artifact_id: ${{ steps.gtk_artifact.outputs.artifact-id }}
    # GTK4/libadwaita shell (ADR 0006) in the nested session: panel,
    # calendar and quick-settings popovers (xdg popups on a layer
    # surface), and the AT-SPI tree a screen reader sees (#71).
    runs-on: ubuntu-latest
    needs: [check]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      # One cache per job: target/ and the registry, keyed by Cargo.lock.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Avoid pulling an entire GNOME/GDM session through portal recommendations.
      # IBus GTK modules are explicit because the live IME proofs require them.
      - name: Use the Ubuntu archive for GTK dependencies
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [[ -f "$source" ]]; then
              sudo sed -i 's|https\?://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends libseat-dev libinput-dev libudev-dev libgbm-dev libdrm-dev libxkbcommon-dev libxkbcommon-x11-dev libegl1 libgl1-mesa-dri libgbm1 pkg-config xvfb xdotool scrot ffmpeg jq dbus libglib2.0-bin xwayland x11-apps x11-utils pipewire wireplumber gstreamer1.0-pipewire gstreamer1.0-tools gstreamer1.0-plugins-good at-spi2-core python3-pyatspi python3-pil libsecret-tools gnome-keyring fonts-cantarell shellcheck libglib2.0-dev libgtk-4-dev libpipewire-0.3-dev libadwaita-1-dev meson ninja-build libwayland-dev wayland-protocols libpam-wrapper ibus ibus-gtk3 ibus-gtk4 gir1.2-ibus-1.0 gir1.2-gtk-3.0 wayland-utils xdg-desktop-portal xdg-desktop-portal-gnome xdg-desktop-portal-gtk
      - run: scripts/ci-install-gtk4-layer-shell
      - run: shellcheck scripts/tuna-gtk-shell-proof scripts/tuna-walkthrough
      # docs/walkthrough.md must match its manifest (docs/walkthrough.tsv).
      - run: scripts/tuna-walkthrough check
      # pam_wrapper backs G-UNLOCK, IBus G-IME and wayland-utils
      # G-WAYLAND-INFO; all required so no stage can silently skip.
      - run: scripts/tuna-gtk-shell-proof --artifacts gtk-shell-artifacts
        env:
          TUNA_REQUIRE_PAM_WRAPPER: "1"
          TUNA_REQUIRE_IBUS: "1"
          TUNA_REQUIRE_WAYLAND_INFO: "1"
      # Native/X11 geometry and physical input at all required virtual scales.
      - run: |
          for scale in 1 1.25 1.5 2; do
            scripts/tuna-scale-proof --scale "$scale" --artifacts "gtk-shell-artifacts/scale-$scale"
          done
          mkdir -p gtk-shell-artifacts/scale
          cat gtk-shell-artifacts/scale-*/assertions.txt > gtk-shell-artifacts/scale/assertions.txt
      # Keep runnable binaries even when a later live proof assertion fails.
      - if: always()
        run: |
          mkdir -p gtk-shell-artifacts/bin
          cp target/debug/tuna-compositor target/debug/tuna-shell-gtk gtk-shell-artifacts/bin/
          cp /usr/local/lib/*/libgtk4-layer-shell.so* gtk-shell-artifacts/bin/ 2>/dev/null || cp /usr/local/lib/libgtk4-layer-shell.so* gtk-shell-artifacts/bin/
      # G-WS-INSERT publishes the targeted insertion frame/state. Full
      # parity captures need native fonts, wallpapers and installed apps;
      # use the uploaded binaries with that reference on the capture host.

      # The feature walkthrough from this run's frames: every frame the
      # manifest names must still be taken, and the bundle is what a
      # docs refresh commits (scripts/tuna-walkthrough).
      - run: scripts/tuna-walkthrough build gtk-shell-artifacts --dest walkthrough
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: walkthrough
          path: walkthrough/
          retention-days: 90
      - if: always()
        run: scripts/ci-prepare-artifacts gtk-shell-artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: gtk_artifact
        if: always()
        with:
          name: gtk-shell
          path: gtk-shell-artifacts/
          retention-days: 14

  portal-security:
    needs: arch-package
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tuna-arch
          path: ${{ runner.temp }}/portal-package
      - run: sudo apt-get -o Acquire::Retries=3 update -qq && sudo apt-get install -y --no-install-recommends podman zstd shellcheck
      - run: shellcheck scripts/tuna-portal-security tests/portal-reference/run.sh tests/portal-reference/settings-run.sh tests/portal-reference/backgrounds-run.sh
      - run: python3 scripts/lib/tuna-portal-artifact-tests.py
      - name: Test packaged compositor with actual GNOME 51 portal consent
        run: |
          mkdir -p "$RUNNER_TEMP/portal-candidate"
          package=$(find "$RUNNER_TEMP/portal-package" -name '*.pkg.tar.zst' -print -quit)
          test -n "$package"
          tar --zstd -xf "$package" -C "$RUNNER_TEMP/portal-candidate"
          mkdir -p "$RUNNER_TEMP/portal-security"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/portal-security/candidate-commit.txt"
          scripts/tuna-portal-security --candidate "$RUNNER_TEMP/portal-candidate" --out "$RUNNER_TEMP/portal-security"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: portal-security
          path: ${{ runner.temp }}/portal-security
          retention-days: 90

  remote-security:
    needs: arch-package
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tuna-arch
          path: ${{ runner.temp }}/remote-package
      - run: sudo apt-get -o Acquire::Retries=3 update -qq && sudo apt-get install -y --no-install-recommends podman zstd shellcheck
      - run: shellcheck scripts/tuna-remote-security tests/remote-desktop-reference/run.sh
      - name: Test packaged compositor with actual GNOME 51 RemoteDesktop consent and libei input
        run: |
          mkdir -p "$RUNNER_TEMP/remote-candidate"
          package=$(find "$RUNNER_TEMP/remote-package" -name '*.pkg.tar.zst' -print -quit)
          test -n "$package"
          tar --zstd -xf "$package" -C "$RUNNER_TEMP/remote-candidate"
          mkdir -p "$RUNNER_TEMP/remote-security"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/remote-security/candidate-commit.txt"
          scripts/tuna-remote-security --candidate "$RUNNER_TEMP/remote-candidate" --out "$RUNNER_TEMP/remote-security"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: remote-security
          path: ${{ runner.temp }}/remote-security
          retention-days: 90

  niri-parity:
    runs-on: ubuntu-26.04
    needs: [arch-package]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tuna-arch
          path: niri-package
      - run: sudo apt-get -o Acquire::Retries=3 update -qq && sudo apt-get install -y podman python3-pil zstd shellcheck
      - run: shellcheck scripts/tuna-niri-reference scripts/tuna-niri-compare tests/niri-reference/run.sh tests/niri-reference/run-tuna.sh
      - run: |
          mkdir -p niri-candidate
          tar --zstd -xf niri-package/tuna-desktop-*.pkg.tar.zst -C niri-candidate
          scripts/tuna-niri-compare --candidate niri-candidate --out niri-parity-artifacts
          printf '%s\n' "$GITHUB_SHA" >niri-parity-artifacts/candidate-revision.txt
      - if: always()
        run: scripts/ci-prepare-artifacts niri-parity-artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: niri-parity
          path: niri-parity-artifacts/
          retention-days: 90

  arch-package:
    # TunaOS Marlin is Arch-based: build, check, and install the Arch
    # package in a clean archlinux container (#69).
    runs-on: ubuntu-latest
    needs: [check]
    timeout-minutes: 40
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git rust pkgconf clang pipewire gtk4 gtk4-layer-shell libadwaita libsecret libxkbcommon libxkbcommon-x11 mesa wayland dbus glib2 seatd libinput systemd-libs libdrm namcap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && TUNA_LOCAL_SRC='$GITHUB_WORKSPACE' makepkg -f --noconfirm"
      - run: |
          pkg=$(ls packaging/arch/tuna-desktop-[0-9]*.pkg.tar.zst)
          namcap "$pkg" || true
          pacman -U --noconfirm "$pkg"
          for bin in tuna-compositor tuna-session tuna-shell-host tuna-greeter; do "$bin" --version; done
          test -f /usr/share/wayland-sessions/tuna.desktop
          mkdir -p arch-artifacts && cp "$pkg" arch-artifacts/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tuna-arch
          path: arch-artifacts/
          retention-days: 14

  marlin-image:
    # Tuna Desktop layered on ghcr.io/tuna-os/marlin:gnome (GNOME 51 baseline
    # image) as a nested preview. Built on every PR, pushed from main.
    runs-on: ubuntu-latest
    needs: [arch-package]
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tuna-arch
          path: arch-artifacts
      - name: Free disk for the Marlin base image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - run: |
          pkg=$(ls arch-artifacts/tuna-desktop-[0-9]*.pkg.tar.zst)
          cp "$pkg" ./tuna.pkg.tar.zst
          podman build -f packaging/marlin/Containerfile \
            --build-arg TUNA_PKG=tuna.pkg.tar.zst \
            -t marlin-tuna-preview:ci .
          podman run --rm marlin-tuna-preview:ci tuna-compositor --version
          podman run --rm marlin-tuna-preview:ci test -f /usr/share/applications/tuna-nested-preview.desktop
          mkdir -p marlin-image-kernels
          kernel_container=$(podman create marlin-tuna-preview:ci /usr/bin/true)
          trap 'podman rm "$kernel_container"' EXIT
          podman cp "$kernel_container:/usr/share/tuna-image-kernels/." marlin-image-kernels/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: marlin-image-kernels
          path: marlin-image-kernels/
          retention-days: 14
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          img=ghcr.io/tuna-os/tuna-desktop/marlin-tuna-preview
          podman tag marlin-tuna-preview:ci "$img:latest"
          podman tag marlin-tuna-preview:ci "$img:${{ github.sha }}"
          podman push "$img:latest"
          podman push "$img:${{ github.sha }}"

  marlin-vm:
    # Real-VM lane (#68): install the Marlin Tuna Desktop image (plus the CI-only
    # autologin/serial-journal layer in packaging/marlin/vm-lane) to a
    # raw disk with bootc, boot it in QEMU/KVM, and prove greetd starts
    # the Tuna Desktop hardware session on the DRM/KMS backend. The image is
    # rebuilt rootful here (bootc install reads it from root's storage),
    # in parallel with marlin-image rather than after it.
    runs-on: ubuntu-26.04
    needs: [arch-package]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tuna-arch
          path: arch-artifacts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
      - name: Free disk for the image and the raw disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          sudo mkdir -p /mnt/vm && sudo chown "$(id -u):$(id -g)" /mnt/vm
          df -h / /mnt
      - run: sudo apt-get -o Acquire::Retries=3 update -qq && sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf ffmpeg pngquant optipng
      - name: Build the Marlin Tuna Desktop image and the VM test layer
        run: |
          cp arch-artifacts/tuna-desktop-[0-9]*.pkg.tar.zst ./tuna.pkg.tar.zst
          sudo podman build -f packaging/marlin/Containerfile \
            --build-arg TUNA_PKG=tuna.pkg.tar.zst -t localhost/marlin-tuna-preview:ci .
          sudo podman build -f packaging/marlin/vm-lane/Containerfile \
            -t localhost/marlin-tuna-vm:ci .
          sudo podman image inspect ghcr.io/tuna-os/marlin:gnome --format '{{.Digest}}' | tee /mnt/vm/base-digest
          sudo podman image inspect localhost/marlin-tuna-vm:ci --format '{{.Id}}' | tee /mnt/vm/image-id
          mkdir -p vm-lane-artifacts/image-kernels
          kernel_container=$(sudo podman create localhost/marlin-tuna-vm:ci /usr/bin/true)
          trap 'sudo podman rm "$kernel_container"' EXIT
          sudo podman cp "$kernel_container:/usr/share/tuna-image-kernels/." vm-lane-artifacts/image-kernels/
          sudo chown -R "$(id -u):$(id -g)" vm-lane-artifacts/image-kernels
          sudo podman run --rm localhost/marlin-tuna-vm:ci sh -c 'bootc --version; ls -ld /home; ls /usr/lib/bootc/install/ && cat /usr/lib/bootc/install/*' || true
          df -h / /mnt
      - name: Install the image to a raw disk with bootc
        run: |
          # Marlin boots with systemd-boot, not bootupd, so it installs
          # on bootc's composefs backend; a sealed composefs root needs
          # fs-verity, which the image's default xfs lacks. Probed from
          # the image the way tuna-os/tunaOS scripts/lib/backend.sh does.
          args=""
          probe='
            if ls /usr/lib/bootupd/updates/EFI/*/grub*.efi >/dev/null 2>&1; then :
            elif grep -A8 "^\[composefs\]" /usr/lib/ostree/prepare-root.conf 2>/dev/null | grep -qiE "enabled[[:space:]]*=[[:space:]]*(yes|true|1|signed)" \
              || find /usr/lib/systemd/boot/efi -name "systemd-boot*.efi" 2>/dev/null | grep -q .; then echo --composefs-backend; fi
            grep -A8 "^\[composefs\]" /usr/lib/ostree/prepare-root.conf 2>/dev/null | grep -qiE "enabled[[:space:]]*=[[:space:]]*(yes|true|1|signed)" && echo "--filesystem ext4" || true'
          args=$(sudo podman run --rm --entrypoint "" localhost/marlin-tuna-vm:ci sh -c "$probe" | tr '\n' ' ')
          echo "bootc install extra args: $args"
          truncate -s 20G /mnt/vm/disk.raw
          # shellcheck disable=SC2086 # $args is a word list on purpose
          sudo podman run --rm --privileged --pid=host \
            --security-opt label=type:unconfined_t \
            -v /dev:/dev -v /var/lib/containers:/var/lib/containers -v /mnt/vm:/output \
            localhost/marlin-tuna-vm:ci \
            bootc install to-disk --via-loopback --generic-image --wipe $args /output/disk.raw
          sudo chown "$(id -u):$(id -g)" /mnt/vm/disk.raw
          sudo podman rmi -a -f >/dev/null 2>&1 || true
          df -h / /mnt
      # After the assertions, --tour drives a scripted feature tour
      # through QMP input and records it to tour/tuna-tour.webm, plus the
      # README hero set in tour/hero/ (scripts/tuna-hero-media installs it).
      - name: Boot the disk, assert the Tuna Desktop hardware session, record the tour
        run: >-
          scripts/tuna-vm-lane --disk /mnt/vm/disk.raw --out vm-lane-artifacts --boots 5 --tour
          --meta "base_image=ghcr.io/tuna-os/marlin:gnome@$(cat /mnt/vm/base-digest)"
          --meta "test_image_id=$(cat /mnt/vm/image-id)"
          --meta "tuna_package=$(basename arch-artifacts/tuna-desktop-[0-9]*.pkg.tar.zst)"
          --meta "commit=${{ github.sha }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: marlin-vm
          path: |
            vm-lane-artifacts/
            !vm-lane-artifacts/tour/
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: tuna-tour
          path: vm-lane-artifacts/tour/
          if-no-files-found: ignore
          retention-days: 30

  parity-ledger:
    # GNOME 51 parity ledger gate (#66): every row marked pass must cite
    # tests, and every cited cargo test / journey assertion must have
    # passed in this run.
    runs-on: ubuntu-latest
    needs: [check, journey, gtk-shell, drm-smoke, marlin-vm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: test-list
          path: ledger-in
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: journey-shots
          path: ledger-in/journey
      - name: Require the successful GTK job's proof artifact
        env:
          GTK_PROOF_ARTIFACT_ID: ${{ needs.gtk-shell.outputs.proof_artifact_id }}
        run: '[[ "$GTK_PROOF_ARTIFACT_ID" =~ ^[0-9]+$ ]]'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.gtk-shell.outputs.proof_artifact_id }}
          path: ledger-in/gtk-shell
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: drm-smoke
          path: ledger-in/drm-smoke
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: marlin-vm
          path: ledger-in/marlin-vm
      - run: >-
          scripts/tuna-ledger check --tests ledger-in/test-list.txt
          --assertions ledger-in/journey/assertions.txt
          --assertions ledger-in/gtk-shell/assertions.txt
          --assertions ledger-in/gtk-shell/scale/assertions.txt
          --assertions ledger-in/drm-smoke/assertions.txt
          --assertions ledger-in/marlin-vm/assertions.txt

  docs-shots:
    runs-on: ubuntu-latest
    needs: [journey, app-content, scroll-proof]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Curate a screenshot set out of this run's own proof artifacts
      # and upload it as one bundle. Nothing is committed from it: the
      # docs use the walkthrough (docs/walkthrough.md), which the GTK
      # shell proof captures.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: journey-shots
          path: /tmp/tuna-docs/journey
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: app-content-shots
          path: /tmp/tuna-docs/app
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: scroll-proof-shots
          path: /tmp/tuna-docs/scroll
      - run: shellcheck scripts/tuna-docs-shots scripts/tuna-hero-media
      - run: scripts/tuna-docs-shots collect /tmp/tuna-docs/journey /tmp/tuna-docs/app /tmp/tuna-docs/scroll --dest /tmp/tuna-docs/shots && ls /tmp/tuna-docs/shots | wc -l | grep -q 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-shots
          path: /tmp/tuna-docs/shots/
          retention-days: 90
