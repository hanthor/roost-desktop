name: ci

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      # smithay links system libxkbcommon via the xkbcommon crate;
      # the greeter UI needs GTK4/libadwaita dev files.
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev pkg-config libgtk-4-dev libadwaita-1-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
