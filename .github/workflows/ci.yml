name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      # One cache per job: target/ and the registry, keyed by Cargo.lock.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # smithay links system libxkbcommon via the xkbcommon crate;
      # the greeter UI needs GTK4/libadwaita dev files.
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && sudo apt-get install -y libseat-dev libinput-dev libudev-dev libgbm-dev libdrm-dev libxkbcommon-dev pkg-config libgtk-4-dev libpipewire-0.3-dev libadwaita-1-dev libpam-wrapper
      # The GTK shell (ADR 0006) links gtk4-layer-shell, which Ubuntu
      # 24.04 does not package.
      - run: sudo apt-get install -y meson ninja-build libwayland-dev wayland-protocols && scripts/ci-install-gtk4-layer-shell
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # pam_wrapper runs the lock screen's PAM path for real (#62); it is
      # required here so the test can never silently skip.
      - run: cargo test --workspace
        env:
          ROOST_REQUIRE_PAM_WRAPPER: "1"
      # Every listed test just passed: the parity-ledger job resolves
      # the ledger's cargo:<name> references against this list.
      - run: cargo test --workspace -q -- --list --format terse > test-list.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-list
          path: test-list.txt
          retention-days: 14

  journey:
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      # One cache per job: target/ and the registry, keyed by Cargo.lock.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Nested session needs a display plus X input/capture tools; the
      # journey asserts liveness and visible reaction, humans review
      # the uploaded frames.
      # libxkbcommon-x11 and EGL are dlopened at winit-backend startup
      # (not at build time), so the nested run needs them even though
      # check does not. Mesa swrast provides software GL on runners.
      # The shell's gio settings read needs glib dev files at build
      # time (check gets them transitively via GTK).
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && sudo apt-get install -y libseat-dev libinput-dev libudev-dev libgbm-dev libdrm-dev libxkbcommon-dev libxkbcommon-x11-dev libegl1 libgl1-mesa-dri libgbm1 pkg-config xvfb xdotool x11-apps scrot shellcheck jq dbus libglib2.0-dev libgtk-4-dev libpipewire-0.3-dev libadwaita-1-dev
      - run: shellcheck -x scripts/roost-journey scripts/roost-nested scripts/roost-release scripts/check-release-package scripts/lib/roost-introspect.sh
      - run: scripts/roost-release --allow-dirty --out package-artifacts && scripts/check-release-package package-artifacts/*.deb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: roost-deb
          path: package-artifacts/
          retention-days: 14
      - run: scripts/roost-journey --artifacts journey-artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: journey-shots
          path: journey-artifacts/
          retention-days: 14

  app-content:
    runs-on: ubuntu-latest
    needs: [check]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      # One cache per job: target/ and the registry, keyed by Cargo.lock.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Headed Chromium as a Wayland client of the nested session, via
      # Playwright. The script asserts our compositor shows app content
      # (baseline-vs-app diff plus app-color pixel count), humans review
      # the uploaded frames. Playwright installs its own venv, browser,
      # and browser system libraries on the runner.
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && sudo apt-get install -y libseat-dev libinput-dev libudev-dev libgbm-dev libdrm-dev libxkbcommon-dev libxkbcommon-x11-dev libegl1 libgl1-mesa-dri libgbm1 pkg-config xvfb xdotool x11-apps scrot shellcheck python3-venv libglib2.0-dev libgtk-4-dev libpipewire-0.3-dev libadwaita-1-dev
      - run: shellcheck scripts/roost-app-content scripts/roost-nested
      - run: scripts/roost-app-content --artifacts app-content-artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: app-content-shots
          path: app-content-artifacts/
          retention-days: 14

  scroll-proof:
    runs-on: ubuntu-latest
    needs: [check]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      # One cache per job: target/ and the registry, keyed by Cargo.lock.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Scroll-mode strip proof: three headed-Chromium windows via
      # Playwright, Super+Shift+T toggle, Super+R preset cycling, and
      # wheel scrolling, with gap-geometry pixel asserts. Humans review
      # the uploaded frames.
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && sudo apt-get install -y libseat-dev libinput-dev libudev-dev libgbm-dev libdrm-dev libxkbcommon-dev libxkbcommon-x11-dev libegl1 libgl1-mesa-dri libgbm1 pkg-config xvfb xdotool x11-apps scrot shellcheck python3-venv libglib2.0-dev libgtk-4-dev libpipewire-0.3-dev libadwaita-1-dev
      - run: shellcheck scripts/roost-scroll-proof scripts/roost-nested
      - run: scripts/roost-scroll-proof --artifacts scroll-proof-artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: scroll-proof-shots
          path: scroll-proof-artifacts/
          retention-days: 14

  drm-smoke:
    # Hardware session (#52) on vkms, the kernel's virtual KMS device:
    # libseat (seatd), GBM/EGL scanout, page-flip pacing, shell attach.
    runs-on: ubuntu-latest
    needs: [check]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      # One cache per job: target/ and the registry, keyed by Cargo.lock.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && sudo apt-get install -y libseat-dev libinput-dev libudev-dev libgbm-dev libdrm-dev libxkbcommon-dev libxkbcommon-x11-dev libegl1 libgl1-mesa-dri libgbm1 pkg-config seatd jq ffmpeg shellcheck libglib2.0-dev libgtk-4-dev libpipewire-0.3-dev libadwaita-1-dev "linux-modules-extra-$(uname -r)"
      - run: shellcheck scripts/roost-drm-smoke
      - run: scripts/roost-drm-smoke --artifacts drm-smoke-artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: drm-smoke
          path: drm-smoke-artifacts/
          retention-days: 14

  gtk-shell:
    # GTK4/libadwaita shell (ADR 0006) in the nested session: panel,
    # calendar and quick-settings popovers (xdg popups on a layer
    # surface), and the AT-SPI tree a screen reader sees (#71).
    runs-on: ubuntu-latest
    needs: [check]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      # One cache per job: target/ and the registry, keyed by Cargo.lock.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && sudo apt-get install -y libseat-dev libinput-dev libudev-dev libgbm-dev libdrm-dev libxkbcommon-dev libxkbcommon-x11-dev libegl1 libgl1-mesa-dri libgbm1 pkg-config xvfb xdotool scrot ffmpeg jq dbus libglib2.0-bin xwayland x11-apps pipewire wireplumber gstreamer1.0-pipewire gstreamer1.0-tools gstreamer1.0-plugins-good at-spi2-core python3-pyatspi fonts-cantarell shellcheck libglib2.0-dev libgtk-4-dev libpipewire-0.3-dev libadwaita-1-dev meson ninja-build libwayland-dev wayland-protocols libpam-wrapper
      - run: scripts/ci-install-gtk4-layer-shell
      - run: shellcheck scripts/roost-gtk-shell-proof scripts/roost-walkthrough
      # docs/walkthrough.md must match its manifest (docs/walkthrough.tsv).
      - run: scripts/roost-walkthrough check
      # pam_wrapper backs G-UNLOCK; required so it never silently skips.
      - run: scripts/roost-gtk-shell-proof --artifacts gtk-shell-artifacts
        env:
          ROOST_REQUIRE_PAM_WRAPPER: "1"
      # Fractional scaling (#59): the same session at GNOME's 150 percent.
      - run: scripts/roost-scale-proof --artifacts gtk-shell-artifacts/scale
      # The feature walkthrough from this run's frames: every frame the
      # manifest names must still be taken, and the bundle is what a
      # docs refresh commits (scripts/roost-walkthrough).
      - run: scripts/roost-walkthrough build gtk-shell-artifacts --dest walkthrough
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: walkthrough
          path: walkthrough/
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gtk-shell
          path: gtk-shell-artifacts/
          retention-days: 14

  arch-package:
    # TunaOS Marlin is Arch-based: build, check, and install the Arch
    # package in a clean archlinux container (#69).
    runs-on: ubuntu-latest
    needs: [check]
    timeout-minutes: 40
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git rust pkgconf clang pipewire gtk4 gtk4-layer-shell libadwaita libxkbcommon libxkbcommon-x11 mesa wayland dbus glib2 seatd libinput systemd-libs libdrm namcap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && ROOST_LOCAL_SRC='$GITHUB_WORKSPACE' makepkg -f --noconfirm"
      - run: |
          pkg=$(ls packaging/arch/roost-[0-9]*.pkg.tar.zst)
          namcap "$pkg" || true
          pacman -U --noconfirm "$pkg"
          for bin in roost-compositor roost-session roost-shell-host roost-greeter; do "$bin" --version; done
          test -f /usr/share/wayland-sessions/roost.desktop
          mkdir -p arch-artifacts && cp "$pkg" arch-artifacts/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: roost-arch
          path: arch-artifacts/
          retention-days: 14

  marlin-image:
    # Roost layered on ghcr.io/tuna-os/marlin:gnome (GNOME 51 baseline
    # image) as a nested preview. Built on every PR, pushed from main.
    runs-on: ubuntu-latest
    needs: [arch-package]
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: roost-arch
          path: arch-artifacts
      - name: Free disk for the Marlin base image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - run: |
          pkg=$(ls arch-artifacts/roost-[0-9]*.pkg.tar.zst)
          cp "$pkg" ./roost.pkg.tar.zst
          podman build -f packaging/marlin/Containerfile \
            --build-arg ROOST_PKG=roost.pkg.tar.zst \
            -t marlin-roost-preview:ci .
          podman run --rm marlin-roost-preview:ci roost-compositor --version
          podman run --rm marlin-roost-preview:ci test -f /usr/share/applications/roost-nested-preview.desktop
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          img=ghcr.io/hanthor/roost-desktop/marlin-roost-preview
          podman tag marlin-roost-preview:ci "$img:latest"
          podman tag marlin-roost-preview:ci "$img:${{ github.sha }}"
          podman push "$img:latest"
          podman push "$img:${{ github.sha }}"

  parity-ledger:
    # GNOME 51 parity ledger gate (#66): every row marked pass must cite
    # tests, and every cited cargo test / journey assertion must have
    # passed in this run.
    runs-on: ubuntu-latest
    needs: [check, journey, gtk-shell, drm-smoke]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-list
          path: ledger-in
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: journey-shots
          path: ledger-in/journey
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gtk-shell
          path: ledger-in/gtk-shell
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: drm-smoke
          path: ledger-in/drm-smoke
      - run: >-
          scripts/roost-ledger check --tests ledger-in/test-list.txt
          --assertions ledger-in/journey/assertions.txt
          --assertions ledger-in/gtk-shell/assertions.txt
          --assertions ledger-in/gtk-shell/scale/assertions.txt
          --assertions ledger-in/drm-smoke/assertions.txt

  docs-shots:
    runs-on: ubuntu-latest
    needs: [journey, app-content, scroll-proof]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Curate the release screenshot set out of this run's own proof
      # artifacts and upload it as one bundle: each release takes its
      # docs/shots refresh from here (see docs/screenshots.md). No
      # byte-freshness gate: the panel clock renders live, so a fresh
      # run legitimately differs from the committed set by its digits.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: journey-shots
          path: /tmp/roost-docs/journey
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: app-content-shots
          path: /tmp/roost-docs/app
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scroll-proof-shots
          path: /tmp/roost-docs/scroll
      - run: shellcheck scripts/roost-docs-shots
      - run: scripts/roost-docs-shots collect /tmp/roost-docs/journey /tmp/roost-docs/app /tmp/roost-docs/scroll --dest /tmp/roost-docs/shots && ls /tmp/roost-docs/shots | wc -l | grep -q 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-shots
          path: /tmp/roost-docs/shots/
          retention-days: 90
