name: victory-checks

# The v1 victory signal (M1 of the v1 plan): informational only. The
# signal carries red; the job stays green. Runs nightly, never on PRs
# (it would fail every PR until v1 is done, which is the point of the
# signal, not of CI).
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  victory-signal:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 scripts/victory-signal.py
        env:
          VICTORY_ROOT: .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: victory-signal
          path: victory-signal.json
          retention-days: 90
