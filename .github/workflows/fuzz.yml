name: control decoder fuzz

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'fuzz/**'
      - 'crates/shell-control-schema/**'
      - '.github/workflows/fuzz.yml'

permissions:
  contents: read

concurrency:
  group: control-fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decoder:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [control_frame, control_body]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: nightly-2026-10-04
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz -> target
          shared-key: control-fuzz
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz with address sanitizer and fixed limits
        env:
          TARGET: ${{ matrix.target }}
          BUDGET: ${{ github.event_name == 'schedule' && '600' || '60' }}
        run: |
          mkdir -p "fuzz/corpus/$TARGET"
          cp "fuzz/seeds/$TARGET/"* "fuzz/corpus/$TARGET/"
          set -o pipefail
          cargo fuzz run "$TARGET" -- -max_total_time="$BUDGET" -max_len=1048580 -timeout=5 -rss_limit_mb=2048 2>&1 | tee "fuzz/$TARGET.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            fuzz/*.log
            fuzz/artifacts/
            fuzz/corpus/
          retention-days: 14
