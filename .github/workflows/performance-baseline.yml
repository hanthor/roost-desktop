name: Marlin performance samples
on:
  pull_request:
    paths:
      - .github/workflows/performance-baseline.yml
      - scripts/roost-vm-perf
      - scripts/roost-frame-pacer-build
      - scripts/lib/roost-frame-pacer.c
      - scripts/lib/roost-perf-*.py
      - scripts/lib/gnome_sysprof.py
      - scripts/lib/fixtures/sysprof-mark.*
      - scripts/lib/fixtures/gnome51-*
      - packaging/marlin/perf/**
  workflow_dispatch:
    inputs:
      package_run:
        description: Successful main ci run containing roost-arch (empty selects latest)
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 scripts/lib/roost-perf-tests.py
      - name: Select a successful trusted main package
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN: ${{ inputs.package_run }}
        run: |
          set -euo pipefail
          mkdir -p perf-artifacts
          run="$PACKAGE_RUN"
          if [[ -z "$run" ]]; then
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          [[ "$run" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > package-run.json
          jq -e '.head_branch == "main" and .event == "push" and .conclusion == "success"' package-run.json
          gh run download "$run" --repo "$GITHUB_REPOSITORY" --name roost-arch --dir arch-artifacts
      - name: Prepare KVM and disk space
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          sudo mkdir -p /mnt/perf && sudo chown "$(id -u):$(id -g)" /mnt/perf
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf shellcheck
          shellcheck scripts/roost-frame-pacer-build
      - name: Build one shared preview payload
        run: |
          set -euo pipefail
          cp arch-artifacts/roost-[0-9]*.pkg.tar.zst roost.pkg.tar.zst
          sha256sum roost.pkg.tar.zst > package.sha256
          sudo podman build -f packaging/marlin/perf/Containerfile.baseline -t localhost/marlin-gnome51-perf:base .
          sudo podman build -f packaging/marlin/Containerfile --build-arg BASE_IMAGE=localhost/marlin-gnome51-perf:base --build-arg ROOST_PKG=roost.pkg.tar.zst -t localhost/marlin-roost-preview:perf .
          sudo podman inspect ghcr.io/tuna-os/marlin:gnome --format '{{.Digest}}' | tee base-digest
          sudo podman inspect localhost/marlin-roost-preview:perf --format '{{.Id}}' | tee shared-image-id
          sudo podman run --rm localhost/marlin-roost-preview:perf gnome-shell --version | tee gnome-version
          grep -Eq '^GNOME Shell 51([. ]|$)' gnome-version
          sudo podman run --rm localhost/marlin-roost-preview:perf pacman -Q | tee baseline-packages.txt
          for file in PKGBUILD release-trace-context.patch frame-source-evidence.patch sha256sums; do
            sudo podman run --rm localhost/marlin-roost-preview:perf cat "/usr/share/roost-perf-mutter-profiler/$file" > "perf-artifacts/mutter-profiler-$file"
          done
      - name: Measure GNOME then Roost on this same host
        run: |
          set -euo pipefail
          mkdir -p perf-artifacts
          cp package-run.json package.sha256 base-digest shared-image-id gnome-version baseline-packages.txt perf-artifacts/
          for desktop in gnome roost; do
            image="localhost/marlin-$desktop-perf:ci"
            sudo podman build -f packaging/marlin/perf/Containerfile --build-arg DESKTOP="$desktop" -t "$image" .
            probe='if grep -A8 "^\[composefs\]" /usr/lib/ostree/prepare-root.conf 2>/dev/null | grep -qiE "enabled[[:space:]]*=[[:space:]]*(yes|true|1|signed)" || ls /usr/lib/systemd/boot/efi/systemd-boot*.efi >/dev/null 2>&1; then echo --composefs-backend; fi; grep -A8 "^\[composefs\]" /usr/lib/ostree/prepare-root.conf 2>/dev/null | grep -qiE "enabled[[:space:]]*=[[:space:]]*(yes|true|1|signed)" && echo "--filesystem ext4" || true'
            args=$(sudo podman run --rm --entrypoint "" "$image" sh -c "$probe" | tr '\n' ' ')
            truncate -s 20G /mnt/perf/disk.raw
            # shellcheck disable=SC2086
            sudo podman run --rm --privileged --pid=host --security-opt label=type:unconfined_t -v /dev:/dev -v /var/lib/containers:/var/lib/containers -v /mnt/perf:/output "$image" bootc install to-disk --via-loopback --generic-image --wipe $args /output/disk.raw
            sudo chown "$(id -u):$(id -g)" /mnt/perf/disk.raw
            scripts/roost-vm-perf --disk /mnt/perf/disk.raw --desktop "$desktop" --out "perf-artifacts/$desktop" --meta "base_digest=$(cat base-digest)" --meta "shared_image_id=$(cat shared-image-id)" --meta "observer_revision=$GITHUB_SHA"
            rm /mnt/perf/disk.raw
            sudo podman rmi "$image"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: marlin-performance
          path: perf-artifacts
          retention-days: 14
