name: nested stress

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/roost-stress'
      - '.github/workflows/stress.yml'

permissions:
  contents: read

concurrency:
  group: nested-stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  churn:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && sudo apt-get install -y libseat-dev libinput-dev libudev-dev libgbm-dev libdrm-dev libxkbcommon-dev libxkbcommon-x11-dev libegl1 libgl1-mesa-dri libgbm1 pkg-config xvfb xdotool scrot ffmpeg jq dbus libglib2.0-bin xwayland x11-apps pipewire wireplumber gstreamer1.0-pipewire gstreamer1.0-tools gstreamer1.0-plugins-good at-spi2-core python3-pyatspi fonts-cantarell shellcheck libglib2.0-dev libgtk-4-dev libpipewire-0.3-dev libadwaita-1-dev meson ninja-build libwayland-dev wayland-protocols libpam-wrapper ibus gir1.2-ibus-1.0 wayland-utils
      - run: scripts/ci-install-gtk4-layer-shell
      - run: cargo build -p roost-compositor -p roost-shell-gtk
      - name: Churn windows and notifications; gate input and growth
        env:
          ROUNDS: ${{ github.event_name == 'schedule' && '300' || '10' }}
        run: scripts/roost-stress --rounds "$ROUNDS" --out stress-artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: nested-stress
          path: stress-artifacts/
          retention-days: 14
