[package]
name = "roost-shell-host"
version = "0.1.0"
edition = "2021"
license.workspace = true

# Wave 2 stream 3 owns this crate. Workspace pins live in the root Cargo.toml.

[dev-dependencies]
roost-compositor = { path = "../compositor" }
tempfile = "3"

[dependencies]
wayland-client.workspace = true
wayland-protocols = { workspace = true, features = ["client"] }
wayland-protocols-wlr = { workspace = true, features = ["client"] }
smithay = { workspace = true }
roost-shell-control = { path = "../shell-control-schema", version = "0.1.0" }
freedesktop-desktop-entry.workspace = true
gio.workspace = true
serde_json.workspace = true
rustix.workspace = true
jiff.workspace = true
xkbcommon.workspace = true
zbus.workspace = true
