[package]
name = "tuna-shell-host"
version = "0.1.0"
edition = "2021"
license.workspace = true

# Wave 2 stream 3 owns this crate. Workspace pins live in the root Cargo.toml.

[dev-dependencies]
tuna-compositor = { path = "../compositor" }
tempfile = "3"

[dependencies]
wayland-client.workspace = true
wayland-protocols = { workspace = true, features = ["client", "unstable"] }
wayland-protocols-wlr = { workspace = true, features = ["client"] }
wayland-protocols-misc = { version = "=0.3.12", features = ["client"] }
tuna-shell-control = { path = "../shell-control-schema", version = "0.1.0" }
freedesktop-desktop-entry.workspace = true
gio.workspace = true
serde_json.workspace = true
rustix.workspace = true
jiff.workspace = true
xkbcommon.workspace = true
zbus.workspace = true
image.workspace = true
resvg.workspace = true
rhai.workspace = true
