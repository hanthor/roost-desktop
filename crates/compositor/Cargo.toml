[package]
name = "roost-compositor"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
smithay.workspace = true
calloop.workspace = true
signal-hook.workspace = true
rand.workspace = true
wayland-protocols.workspace = true
roost-shell-control = { path = "../shell-control-schema", version = "0.1.0" }
roost-greeter = { path = "../greeter", version = "0.1.0" }
greetd_ipc.workspace = true
image.workspace = true

[features]
# Additive X11 compatibility: enables Smithay's xwayland module within the
# pinned =0.7.0 release (ADR 0001). Default builds are native-only.
xwayland = ["smithay/xwayland"]

[dev-dependencies]
wayland-client.workspace = true
wayland-protocols = { workspace = true, features = ["client"] }
wayland-protocols-wlr = { workspace = true, features = ["client"] }
tempfile = "3"
