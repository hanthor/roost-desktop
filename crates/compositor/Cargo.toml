[package]
name = "roost-compositor"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
smithay.workspace = true
calloop.workspace = true
signal-hook.workspace = true
rand.workspace = true
wayland-protocols.workspace = true
roost-shell-control = { path = "../shell-control-schema", version = "0.1.0" }
# The unlock path uses the greeter's prompt model and greetd client only; the
# GTK window is never constructed here, so `gtk-ui` stays off and the
# compositor's build needs no GTK system libraries.
roost-greeter = { path = "../greeter", version = "0.1.0", default-features = false }
greetd_ipc.workspace = true
image.workspace = true
serde_json.workspace = true

[features]
default = ["drm"]
# Additive X11 compatibility: enables Smithay's xwayland module within the
# pinned =0.7.0 release (ADR 0001). Default builds are native-only.
xwayland = ["smithay/xwayland"]
# Hardware session (#52): DRM/KMS output through GBM/EGL, libseat session,
# udev device discovery, libinput input. Needs libseat, libinput, libudev,
# gbm, and libdrm at build time. The nested winit backend stays available.
drm = [
    "smithay/backend_drm",
    "smithay/backend_gbm",
    "smithay/backend_egl",
    "smithay/backend_libinput",
    "smithay/backend_session_libseat",
    "smithay/backend_udev",
    "smithay/renderer_gl",
]

[dev-dependencies]
wayland-client.workspace = true
wayland-protocols = { workspace = true, features = ["client"] }
wayland-protocols-wlr = { workspace = true, features = ["client"] }
tempfile = "3"
